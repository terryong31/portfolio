title: About Me
description: The unfiltered version — how Terry Ong went from copy-pasting his way through school to building AI systems, losing sleep to hackathons, and playing Metallica on a Hello Kitty guitar.
content: |
  Hey, I'm **Terry** 👋 I'm an AI engineer in Malaysia who builds things that probably shouldn't work — until, somehow, they do. Give me a half-baked idea, an LLM, and a deadline, and I'll turn it into something people can actually use (or at least a very convincing demo).

  ### How I actually got here

  Real talk: I coasted through most of school. ChatGPT dropped and I basically copy-pasted my way through everything — learned almost nothing, and I knew it. What *actually* taught me to code was [Codédex](https://www.codedex.io) and a dumb little airline booking system I built by hand — no AI, just me figuring out Python line by painful line. That project is where it finally clicked: how code really works, how to *design* a system instead of duct-taping snippets together. Everything I do now traces back to that one.

  ### The hackathon problem

  I'm addicted to hackathons, full stop. There's nothing like starting with an empty repo at 9am and having a working demo — held together with hope and duct tape — by the next morning. I've built an AI marketplace that haggles and closes its own sales, a prompt-injection detector that swats attacks in under 100ms, and a hospital finder that genuinely helped people find hospitals. Some won, some flopped. Winning's nice, but honestly I'm just there for the 24-hour chaos.

  Day job? I'm an **AI Engineer at Finknight** — auth flows, Python automations, and shaving milliseconds off page loads because slow websites piss me off on a personal level.

  ### How I work

  Ship first, philosophise later. I'd rather push an ugly thing that works than polish a beautiful thing that dies in a "coming soon" folder. Most of my favourite projects started as a stupid *"wait… what if"* at 2am. I break a lot of stuff. I fix most of it.

  ### When I'm not at a keyboard

  I play guitar — badly, loudly, and with three of them, including a Hello Kitty Squier that has watched me butcher Metallica riffs it was absolutely not built for. Heavy metal, hard rock, a bit of cantopop when nobody's looking. When the guitars are down I'm usually deep in a AAA game — RDR2, God of War, The Last of Us, basically the whole cinematic sad-dad-simulator genre. And coffee. Always coffee.

  If any of this sounds like your kind of energy, [poke around my projects](/projects) or just [say hi](mailto:terryong30@gmail.com) — I'm always down to build something weird.
