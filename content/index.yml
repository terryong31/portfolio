faq:
  title: Frequently Asked Questions
  description: Answers to common questions about what I do and how I work.
  categories:
    - title: Services & Process
      questions:
        - label: What do you specialize in?
          content: |
            I build AI-powered software systems — LLM pipelines, RAG applications, agentic workflows with LangGraph, and full-stack web apps with Nuxt.js and FastAPI. I also handle cloud infrastructure (AWS, Azure, Vercel, Supabase) and have experience automating financial data workflows, web scraping pipelines, and multi-tenant auth systems.
        - label: What's your approach to building software?
          content: |
            I focus on shipping working software fast and iterating. I start with understanding the problem, pick the simplest architecture that works, build it, then optimize. I've done this under extreme time pressure at hackathons (built and deployed a full marketplace in 2 hours) and in production environments at FinKnight.
        - label: Do you compete in hackathons?
          content: |
            Yes — I've placed in multiple AI hackathons including Student Winner at ASEAN AI Malaysia Summit Code Fest, 1st Runner Up at CIMB x Microsoft Data Science & Gen AI Hackathon, Apify Track Winner at the $1 Hackathon, and Top 5 at the Deriv AI Hackathon. I enjoy the intensity and the constraint of building something real under pressure.
    - title: Collaboration & Availability
      questions:
        - label: Are you available for freelance or contract work?
          content: |
            I'm selectively open to projects — especially anything involving LLM integration, fintech, or agentic AI systems. If the problem is interesting and the scope is clear, I'm keen to chat. Reach out via email or LinkedIn.
        - label: What's your tech stack?
          content: |
            Python, TypeScript, SQL on the language side. Nuxt.js, FastAPI, LangGraph, LangChain for frameworks. Supabase, AWS, Azure, Vercel, Docker, GitHub Actions for infrastructure. Gemini, Groq, Pgvector, TensorFlow for AI/ML.
        - label: Where are you based?
          content: |
            I'm based in Selangor, Malaysia. I work with teams both locally and remotely. Most of my hackathon and project collaborations have been hybrid or fully remote.
    - title: About Me
      questions:
        - label: What drives you as an engineer?
          content: |
            I like building things that work in the real world, not just demos. The gap between a cool prototype and a production system is where the actual engineering happens — auth, data integrity, performance, cost optimization. That's the part I enjoy most.
        - label: What's your background?
          content: |
            I hold a Bachelor of Computer Science (Hons.) from Quest International University, Ipoh. I've been building AI systems professionally since 2026 at FinKnight, and have been active in the Malaysian AI hackathon scene since 2025.
